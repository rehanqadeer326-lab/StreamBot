# Pure Nixpacks configuration (No auto-providers)
providers = []

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "ffmpeg", "gcc"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "npm install",
    "python3 -m venv /app/venv",
    "/app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]

[start]
cmd = "PATH=\"/app/venv/bin:$PATH\" node launcher.js"
