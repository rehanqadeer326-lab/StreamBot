# Final optimized nixpacks.toml
providers = ["node", "python"]

[phases.setup]
nixPkgs = ["ffmpeg"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "npm install",
    "python3 -m pip install -r requirements.txt"
]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]

[start]
cmd = "node launcher.js"
